; Detector C2 (ESP32-S3): ErrP-AE int8 con TensorFlow Lite Micro, ESP-IDF
; App actual: verificación del motor en la placa (CLAUDE.md, prueba 12). Corre
; test/test_c_engine.c: vectores dorados con TFLM + ESP-NN y benchmark (< 20 ms por época).
;   pio run -t upload -t monitor
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
