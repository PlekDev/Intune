; INTUNE Detector (C2): ESP32-S3, ErrP-AE int8 con TensorFlow Lite Micro, ESP-IDF
;   pio run -t upload -t monitor                   app del detector (default)
;   pio run -e engine_test -t upload -t monitor    verificación del motor ae_* en la placa (prueba 12):
;                                                  vectores dorados TFLM + ESP-NN y benchmark (< 20 ms por época)
[platformio]
default_envs = detector

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

[env:detector]

[env:engine_test]
board_build.cmake_extra_args = -DDETECTOR_ENGINE_TEST=1
