; INTUNE C3: supervisor del brazo (ESP32 aparte), ESP-IDF.
; Habla con el RoArm-M2-S por ESP-NOW (firmware de fábrica, sin tocar) y con el S3 por UART + GPIO.
[env:supervisor]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
