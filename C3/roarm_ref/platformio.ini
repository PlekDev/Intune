; Referencia: firmware de fábrica del RoArm-M2-S (Waveshare). NO se graba en el brazo (decisión del equipo:
; el ESP32 del brazo no se toca). Se conserva para consultar el protocolo JSON / ESP-NOW y compila como verificación.
; src/ = github.com/waveshareteam/roarm_m2 @ c6ccc5b (2025-01-13); lib/SCServo = waveshareteam/ugv_base_general @ d308df9.
[platformio]
; pioarduino en su propio directorio: si no, sustituye a la plataforma global espressif32 que usan C1/C2.
platforms_dir = ~/.platformio/platforms-pioarduino
packages_dir = ~/.platformio/packages-pioarduino

[env:roarm_m2]
; pioarduino: Arduino-ESP32 3.1.3 (el firmware usa la API 3.x de ESP-NOW)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; El IDE de Arduino no trata return-type como error; así compilamos el código oficial sin tocarlo.
build_flags = -Wno-error=return-type
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
